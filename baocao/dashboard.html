<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Báo cáo quảng cáo</title>
<style>
:root{--bg:#f4f6f9;--panel:#fff;--text:#1c2430;--muted:#66717f;--line:#e2e6ec;--accent:#1f6feb;--good:#1a7f37;--bad:#cf222e;--chip:#eef2f7}
@media (prefers-color-scheme: dark){:root{--bg:#0f1419;--panel:#171d24;--text:#e6ebf0;--muted:#8b96a3;--line:#29313b;--accent:#4b91f7;--good:#3fb950;--bad:#f85149;--chip:#1f2730}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0 12px 0 0}
select,input,button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 10px}
button{cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.presets button.on{background:var(--chip);border-color:var(--accent)}
.grow{flex:1}
main{padding:18px 20px;max-width:1400px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .l{color:var(--muted);font-size:12.5px}
.kpi .v{font-size:23px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .h{color:var(--muted);font-size:11.5px;margin-top:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:18px}
.panel h2{font-size:15px;margin:0 0 10px}
.chartbox{position:relative;height:280px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:180px}
th{color:var(--muted);font-weight:600;font-size:12.5px;cursor:pointer;user-select:none}
tr:hover td{background:var(--chip)}
.bar{display:inline-block;height:6px;border-radius:3px;background:var(--accent);opacity:.55;margin-left:6px;vertical-align:middle}
#login{max-width:380px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px}
#login h1{font-size:18px;margin:0 0 6px}
#login p{color:var(--muted);margin:0 0 14px}
#login input{width:100%;margin-bottom:10px}
.err{color:var(--bad)}
.muted{color:var(--muted)}
@media (max-width:640px){header{padding:12px 16px}main{padding:14px 16px}.kpi .v{font-size:20px}}
</style>
</head>
<body>
<div id="login" hidden>
  <h1>Báo cáo quảng cáo</h1>
  <p>Siêu Nét Player. Nhập mật khẩu quản trị (STATS_ADMIN_KEY trên VPS).</p>
  <input id="key" type="password" autocomplete="current-password" placeholder="Mật khẩu quản trị">
  <button class="primary" id="go" style="width:100%">Xem báo cáo</button>
  <p class="err" id="loginErr"></p>
</div>

<div id="app" hidden>
<header>
  <h1>Báo cáo quảng cáo</h1>
  <select id="ad"><option value="">Tất cả quảng cáo</option></select>
  <span class="presets">
    <button data-d="0">Hôm nay</button><button data-d="1">Hôm qua</button><button data-d="7">7 ngày</button><button data-d="30">30 ngày</button><button data-d="90">90 ngày</button>
  </span>
  <input type="date" id="from"> – <input type="date" id="to">
  <span class="grow"></span>
  <span class="muted" id="updated"></span>
  <button id="refresh">Làm mới</button>
  <button id="logout">Thoát</button>
</header>
<main>
  <section class="kpis" id="kpis"></section>
  <section class="panel">
    <h2>Theo ngày</h2>
    <div class="chartbox"><canvas id="chart"></canvas></div>
  </section>
  <section class="panel">
    <div class="tabs" id="tabs"></div>
    <div class="tablewrap"><table id="table"></table></div>
    <p class="muted" style="margin:10px 0 0;font-size:12.5px">Bấm tiêu đề cột để sắp xếp. <a href="#" id="csv">Tải CSV</a></p>
  </section>
</main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const nf = new Intl.NumberFormat('vi-VN');
const pf = v => (v * 100).toLocaleString('vi-VN', {maximumFractionDigits: 2}) + '%';
const df = v => v.toLocaleString('vi-VN', {maximumFractionDigits: 2});
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let KEY = ''; try { KEY = localStorage.getItem('sn_stats_key') || ''; } catch (e) {}
let data = null, tab = 'ad', sortCol = null, sortDesc = true, chart = null;

const TABS = [
  ['ad', 'Quảng cáo'], ['day', 'Ngày'], ['hour', 'Giờ trong ngày'], ['gpu', 'Card đồ hoạ (VGA)'],
  ['cpu', 'CPU'], ['ram', 'RAM'], ['os', 'Windows'], ['screen', 'Màn hình'], ['app', 'Phiên bản player'],
];
const COLS = [
  ['imp', 'Hiển thị', nf.format], ['reach', 'PC tiếp cận', nf.format], ['freq', 'Tần suất', df],
  ['clicks', 'Click', nf.format], ['ctr', 'CTR', pf], ['uclicks', 'PC click', nf.format], ['uctr', 'CTR theo PC', pf],
  ['skip_rate', 'Tỷ lệ bỏ qua', pf], ['full_rate', 'Xem hết', pf], ['avg_sec', 'Xem TB (giây)', v => v == null ? '–' : df(v)],
];

function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function preset(n) {
  const to = new Date(), from = new Date();
  if (n === 1) { to.setDate(to.getDate() - 1); from.setDate(from.getDate() - 1); }
  else if (n > 1) from.setDate(from.getDate() - (n - 1));
  $('from').value = ymd(from); $('to').value = ymd(to);
  document.querySelectorAll('.presets button').forEach(b => b.classList.toggle('on', +b.dataset.d === n));
  load();
}

async function load() {
  const q = new URLSearchParams({from: $('from').value, to: $('to').value, ad: $('ad').value});
  let r;
  try { r = await fetch('api/report?' + q, {headers: {Authorization: 'Bearer ' + KEY}}); }
  catch (e) { $('updated').textContent = 'Không kết nối được máy chủ'; return; }
  if (r.status === 401) { showLogin('Sai mật khẩu.'); return; }
  if (!r.ok) { $('updated').textContent = 'Lỗi ' + r.status; return; }
  data = await r.json();
  $('login').hidden = true; $('app').hidden = false;
  const cur = $('ad').value;
  $('ad').innerHTML = '<option value="">Tất cả quảng cáo</option>' + data.ads.map(a => '<option' + (a === cur ? ' selected' : '') + '>' + esc(a) + '</option>').join('');
  $('updated').textContent = 'Cập nhật ' + new Date().toLocaleTimeString('vi-VN');
  render();
}

function render() {
  const t = data.total;
  const K = [
    ['Lượt hiển thị', nf.format(t.imp || 0), 'số lần quảng cáo hiện'],
    ['PC tiếp cận', nf.format(t.reach || 0), 'số máy khác nhau đã thấy'],
    ['Tần suất', df(t.freq), 'lượt hiện trung bình mỗi máy'],
    ['Lượt click', nf.format(t.clicks || 0), 'mở trang nhà quảng cáo'],
    ['CTR', pf(t.ctr), 'click / hiển thị'],
    ['PC click', nf.format(t.uclicks || 0), 'số máy khác nhau đã click'],
    ['CTR theo PC', pf(t.uctr), 'PC click / PC tiếp cận'],
    ['Tỷ lệ bỏ qua', pf(t.skip_rate), 'bấm bỏ qua trước khi phim tự phát'],
    ['Xem hết', pf(t.full_rate), 'quảng cáo hiện tới lúc phim tự phát'],
    ['Thời gian xem TB', t.avg_sec == null ? '–' : df(t.avg_sec) + ' giây', 'mỗi lượt hiện'],
    ['PC hoạt động', nf.format(t.pcs || 0), 'máy có gửi số liệu trong kỳ'],
    ['PC mới', nf.format(t.new_pcs || 0), 'lần đầu gửi số liệu trong kỳ'],
  ];
  $('kpis').innerHTML = K.map(k => '<div class="kpi"><div class="l">' + k[0] + '</div><div class="v">' + k[1] + '</div><div class="h">' + k[2] + '</div></div>').join('');
  drawChart();
  $('tabs').innerHTML = TABS.map(([k, l]) => '<button data-k="' + k + '" class="' + (k === tab ? 'on' : '') + '">' + l + '</button>').join('');
  drawTable();
}

function drawChart() {
  if (!window.Chart) return;
  const css = getComputedStyle(document.documentElement);
  const c = n => css.getPropertyValue(n).trim();
  const rows = data.by_day;
  const cfg = {
    data: {
      labels: rows.map(r => r.k.slice(5).split('-').reverse().join('/')),
      datasets: [
        {type: 'bar', label: 'Hiển thị', data: rows.map(r => r.imp), backgroundColor: c('--accent') + '99', yAxisID: 'y'},
        {type: 'line', label: 'PC tiếp cận', data: rows.map(r => r.reach), borderColor: c('--good'), backgroundColor: c('--good'), yAxisID: 'y', tension: .25},
        {type: 'line', label: 'Click', data: rows.map(r => r.clicks), borderColor: c('--bad'), backgroundColor: c('--bad'), yAxisID: 'y2', tension: .25},
      ],
    },
    options: {
      maintainAspectRatio: false, interaction: {mode: 'index', intersect: false},
      plugins: {legend: {labels: {color: c('--text')}}},
      scales: {
        x: {ticks: {color: c('--muted')}, grid: {color: c('--line')}},
        y: {beginAtZero: true, ticks: {color: c('--muted'), precision: 0}, grid: {color: c('--line')}, title: {display: true, text: 'Hiển thị / PC', color: c('--muted')}},
        y2: {beginAtZero: true, position: 'right', ticks: {color: c('--muted'), precision: 0}, grid: {display: false}, title: {display: true, text: 'Click', color: c('--muted')}},
      },
    },
  };
  if (chart) chart.destroy();
  chart = new Chart($('chart'), cfg);
}

function tableRows() {
  let rows = (data['by_' + tab] || []).slice();
  if (tab === 'hour') rows.forEach(r => r.label = String(r.k).padStart(2, '0') + ':00');
  else if (tab === 'day') rows.forEach(r => r.label = r.k.split('-').reverse().join('/'));
  else rows.forEach(r => r.label = r.k);
  if (sortCol) rows.sort((a, b) => ((a[sortCol] ?? -1) - (b[sortCol] ?? -1)) * (sortDesc ? -1 : 1));
  return rows;
}

function drawTable() {
  const rows = tableRows();
  const max = Math.max(1, ...rows.map(r => r.imp || 0));
  const head = '<tr><th data-c="">' + TABS.find(x => x[0] === tab)[1] + '</th>' +
    COLS.map(([k, l]) => '<th data-c="' + k + '">' + l + (sortCol === k ? (sortDesc ? ' ▾' : ' ▴') : '') + '</th>').join('') + '</tr>';
  const body = rows.length ? rows.map(r => '<tr><td>' + esc(r.label) + '<span class="bar" style="width:' + Math.round(60 * (r.imp || 0) / max) + 'px"></span></td>' +
    COLS.map(([k, , f]) => '<td>' + f(r[k] ?? 0) + '</td>').join('') + '</tr>').join('')
    : '<tr><td colspan="' + (COLS.length + 1) + '" class="muted">Chưa có số liệu trong khoảng này.</td></tr>';
  $('table').innerHTML = '<thead>' + head + '</thead><tbody>' + body + '</tbody>';
}

function csv() {
  const rows = tableRows();
  const lines = [[TABS.find(x => x[0] === tab)[1], ...COLS.map(c => c[1])].join(',')];
  for (const r of rows) lines.push(['"' + String(r.label).replace(/"/g, '""') + '"', ...COLS.map(([k]) => r[k] ?? '')].join(','));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\n')], {type: 'text/csv'}));
  a.download = 'bao-cao-' + tab + '-' + $('from').value + '_' + $('to').value + '.csv';
  a.click();
}

function showLogin(msg) {
  $('app').hidden = true; $('login').hidden = false;
  $('loginErr').textContent = msg || ''; $('key').focus();
}

$('go').onclick = () => { KEY = $('key').value; try { localStorage.setItem('sn_stats_key', KEY); } catch (e) {} preset(7); };
$('key').onkeydown = e => { if (e.key === 'Enter') $('go').click(); };
$('logout').onclick = () => { KEY = ''; try { localStorage.removeItem('sn_stats_key'); } catch (e) {} showLogin(); };
$('refresh').onclick = load;
$('ad').onchange = load;
$('from').onchange = $('to').onchange = () => { document.querySelectorAll('.presets button').forEach(b => b.classList.remove('on')); load(); };
document.querySelectorAll('.presets button').forEach(b => b.onclick = () => preset(+b.dataset.d));
$('tabs').onclick = e => { const k = e.target.dataset.k; if (k) { tab = k; sortCol = null; render(); } };
$('table').onclick = e => { const c = e.target.closest('th')?.dataset.c; if (c === undefined) return; if (sortCol === c) sortDesc = !sortDesc; else { sortCol = c || null; sortDesc = true; } drawTable(); };
$('csv').onclick = e => { e.preventDefault(); csv(); };
if (KEY) preset(7); else showLogin();
</script>
</body>
</html>
